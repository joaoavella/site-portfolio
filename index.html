<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="src/css/style.css">
    
    <!-- Link para o script Javascript (defer garante que o script carregue após o HTML) -->
    <script src="src/js/script.js" defer></script>
</head>
<body>

    <div class="portfolio-card">
        <!-- Foto de Perfil -->
        <div class="profile-container">
            <img src="src/img/foto.jpg" alt="Foto de Perfil" class="profile-img" onerror="this.src='https://placehold.co/150/121214/a78bfa?text=Dev'">
            <div class="status-dot"></div>
        </div>

        <!-- Nome -->
        <h1 class="profile-name">João Avella</h1>
        
        <!-- Cargo/Subtítulo com efeito de máquina de escrever -->
        <div class="profile-title">
            <span id="typewriter"></span><span class="cursor">&nbsp;</span>
        </div>

        <!-- Seção de Informações Gerais -->
        <div class="info-section">
            <div class="info-row">
                <span class="info-label">~ age:</span>
                <span class="info-value">20 anos</span>
            </div>
            <div class="info-row">
                <span class="info-label">~ university:</span>
                <span class="info-value">IME-USP</span>
            </div>
            <div class="info-row">
                <span class="info-label">~ major:</span>
                <span class="info-value">Ciência da Computação</span>
            </div>
            <div class="info-row">
                <span class="info-label">~ company:</span>
                <span class="info-value">Serviço de Apoio Institucional IME-USP</span>
            </div>
            <div class="info-row">
                <span class="info-label">~ position:</span>
                <span class="info-value">Estagiário em Desenvolvimento de Software</span>
            </div>
        </div>

        <!-- Botão Destaque para o Blog / Trilhas -->
        <a href="blog.html" class="btn-blog">
            <span>[ Ver Minhas Notas das Trilhas ]</span>
        </a>

        <!-- Botões Sociais -->
        <div class="social-links">
            <!-- GitHub -->
            <a href="https://github.com/joaoavella" target="_blank" class="btn-social">
                <svg viewBox="0 0 24 24">

                </svg>
                GitHub
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com/in/joão-avella-1aa566244" target="_blank" class="btn-social">
                <svg viewBox="0 0 24 24">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>

            <!-- E-mail -->
            <a href="mailto:joaoavella@usp.br" class="btn-social">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12.713l-11.985-9.713h23.97l-11.985 9.713zm0 2.574l12-9.725v15.438h-24v-15.438l12 9.725z"/>
                </svg>
                E-mail
            </a>
        </div>
    </div>

</html>
